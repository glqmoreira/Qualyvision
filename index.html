<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QualyVision AI — MVP 0.2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08100d;color:#fff;font-family:Arial,sans-serif}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#c{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#ui{position:fixed;inset:0;pointer-events:none}
.top{padding:15px 16px;background:linear-gradient(#000c,transparent)}
.title{font-size:18px;font-weight:700}.sub{font-size:12px;opacity:.75;margin-top:3px}
.card{position:absolute;left:12px;right:12px;bottom:12px;background:#0b1512e8;border:1px solid #ffffff25;border-radius:14px;padding:12px;pointer-events:auto}
.row{display:flex;justify-content:space-between;font-size:13px;margin:5px 0}
.ok{color:#53e27e}.bad{color:#ff6464}.muted{color:#bbb}
button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;font-weight:700}
#start{background:#fff;color:#111} #stop{background:#2a3430;color:#fff}
#msg{font-size:12px;color:#bbb;margin-top:8px;line-height:1.35}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="ui">
 <div class="top"><div class="title">QUALYVISION AI</div><div class="sub">MVP 0.2 — Tracking real por fluxo óptico</div></div>
 <div class="card">
  <div class="row"><span>Câmera</span><b id="cam" class="bad">desligada</b></div>
  <div class="row"><span>Pontos rastreados</span><b id="n">0</b></div>
  <div class="row"><span>Tracking</span><b id="tr" class="bad">aguardando</b></div>
  <button id="start">INICIAR CÂMERA</button>
  <button id="stop">PARAR</button>
  <div id="msg">O navegador precisa estar em HTTPS (ou localhost) para liberar a câmera.</div>
 </div>
</div>
<script async src="https://docs.opencv.org/4.x/opencv.js" onload="cvReady()"></script>
<script>
let cvLoaded=false; function cvReady(){cvLoaded=true; document.getElementById('msg').textContent='OpenCV carregado. Inicie a câmera.';}
const v=document.getElementById('v'), c=document.getElementById('c'), ctx=c.getContext('2d');
const cam=document.getElementById('cam'), n=document.getElementById('n'), tr=document.getElementById('tr'), msg=document.getElementById('msg');
let stream=null, running=false, cap, prevGray, prevPts, frame=new cv.Mat(), gray, mask;

function size(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',size); size();

async function start(){
 try{
  if(!window.isSecureContext) throw new Error('Página não está em contexto seguro. Abra por HTTPS.');
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('getUserMedia não está disponível neste navegador.');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  v.srcObject=stream; await v.play();
  cam.textContent='ativa'; cam.className='ok'; running=true;
  msg.textContent='Movimente lentamente o celular sobre a cena. Os pontos serão acompanhados frame a frame.';
  requestAnimationFrame(loop);
 }catch(e){msg.textContent='ERRO: '+e.message; console.error(e);}
}
function stop(){
 running=false; if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 cam.textContent='desligada';cam.className='bad';tr.textContent='parado';tr.className='bad';
}
function init(){
 cap=new cv.VideoCapture(v);
 frame=new cv.Mat(v.videoHeight,v.videoWidth,cv.CV_8UC4);
 gray=new cv.Mat(); prevGray=new cv.Mat(); mask=new cv.Mat();
 cap.read(frame); cv.cvtColor(frame,prevGray,cv.COLOR_RGBA2GRAY);
 prevPts=new cv.Mat(); cv.goodFeaturesToTrack(prevGray,prevPts,180,0.01,8,mask,7,false,0.04);
 n.textContent=prevPts.rows; tr.textContent='ativo'; tr.className='ok';
}
function loop(){
 if(!running)return;
 if(v.readyState<2){requestAnimationFrame(loop);return}
 if(!prevPts || prevPts.rows<20){init();requestAnimationFrame(loop);return}
 cap.read(frame); cv.cvtColor(frame,gray,cv.COLOR_RGBA2GRAY);
 let nextPts=new cv.Mat(), status=new cv.Mat(), err=new cv.Mat();
 cv.calcOpticalFlowPyrLK(prevGray,gray,prevPts,nextPts,status,err,new cv.Size(21,21),3);
 ctx.clearRect(0,0,c.width,c.height);
 const sx=c.width/frame.cols, sy=c.height/frame.rows;
 let kept=0;
 for(let i=0;i<nextPts.rows;i++){
   if(status.data[i]!==1) continue;
   const x=nextPts.data32F[i*2]*sx, y=nextPts.data32F[i*2+1]*sy;
   ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle='#55e981';ctx.fill();
   ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.strokeStyle='#55e981aa';ctx.lineWidth=2;ctx.stroke();
   kept++;
 }
 n.textContent=kept; tr.textContent=kept>10?'ativo':'perdendo pontos'; tr.className=kept>10?'ok':'bad';
 prevGray.delete(); prevGray=gray; gray=null;
 prevPts.delete(); prevPts=nextPts;
 nextPts=null;status.delete();err.delete();
 requestAnimationFrame(loop);
}
document.getElementById('start').onclick=()=>{if(cvLoaded)start();else msg.textContent='Aguardando carregamento do OpenCV...'};
document.getElementById('stop').onclick=stop;
</script>
</body>
</html>
